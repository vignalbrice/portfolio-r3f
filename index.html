<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brice Vignal - Portfolio</title>
    <meta
      name="description"
      content="Portfolio de Brice Vignal, développeur front-end spécialisé React, TypeScript et Three.js / WebGL."
    />
    <meta name="theme-color" content="#eff6ff" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Google Fonts : préconnexion + feuille non bloquante (remplace l'@import CSS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />

    <!-- Assets 3D du premier écran : chargés en parallèle du bundle JS -->
    <link rel="preload" as="fetch" crossorigin href="/models/office.glb" />
    <link rel="preload" as="fetch" crossorigin href="/models/avatar.glb" />
    <link rel="preload" as="fetch" crossorigin href="/animations/animations.glb" />
    <link rel="preload" as="image" href="/textures/Baked.jpg" />

    <!-- Open Graph -->
    <meta property="og:title" content="Brice Vignal - Portfolio" />
    <meta
      property="og:description"
      content="Développeur front-end React / TypeScript / Three.js."
    />
    <meta property="og:image" content="/website.jpg" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
